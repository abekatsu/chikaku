[package]
name = "chikaku-server"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# clock フィーチャは入れない。現在時刻は worker::Date から取る (ADR-5)。
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "alloc"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "rng-getrandom"] }
hex = "0.4"
sha2 = "0.11"
base64 = "0.22"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
