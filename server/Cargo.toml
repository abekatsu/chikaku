[package]
name = "chikaku-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace", "cors", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }

[dev-dependencies]
http = "1.5.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
